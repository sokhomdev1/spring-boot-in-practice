spring:
  application:
    name: auth
  # Database Configuration
  datasource:
    pg:
      url: jdbc:postgresql://localhost:5432/dbdev
      username: dev_user
      password: qwer123
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        pool-name: PgHikariCP

# TODO: uncomment if multi datasource
#    mysql:
#      url: jdbc:postgresql://localhost:5432/dbqa
#      username: qa_user
#      password: qwer123
#      driver-class-name: org.postgresql.Driver
#      hikari:
#        maximum-pool-size: 10
#        minimum-idle: 2
#        pool-name: PgHikariCP

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: qwer123

  # Security (for development)
  security:
    user:
      name: user
      password: password

  # JPA Configuration=update
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Server Configuration
server:
  port: 8080

# Logging
logging:
  pattern:
    console: "%d{ISO8601} [%thread] [%X{traceId}] [%X{spanId}] %-5level %logger{40} - %msg%n"
  level:
    com.auth: DEBUG
    org:
      springframework:
        security: DEBUG
        data:
          audit: DEBUG

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,auditevents
  endpoint:
    health:
      show-details: always